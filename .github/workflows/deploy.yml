name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

defaults:
  run:
    shell: pwsh

env:
  BASE_NAME: ${{ vars.BASE_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME || format('{0}-rg', vars.BASE_NAME) }}

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BASE_NAME)) {
            throw "BASE_NAME variable is not set"
          }
          if ($env:BASE_NAME -notmatch '^[a-z][a-z0-9]{2,16}$') {
            throw "BASE_NAME '$($env:BASE_NAME)' is invalid: 3-17 lowercase letters/digits, starting with a letter"
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_LOCATION)) {
            throw "AZURE_LOCATION variable is not set"
          }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate location
        uses: azure/cli@v3
        with:
          inlineScript: |
            if [ -z "$(az account list-locations --query "[?name=='$AZURE_LOCATION'].name" -o tsv)" ]; then
              echo "AZURE_LOCATION '$AZURE_LOCATION' is not a valid Azure region"
              exit 1
            fi

      # The resource group is created up front by bicep/bootstrap.bicep (run once locally).
      # This applies the main template incrementally, so it only updates what changed.
      - name: Deploy infrastructure (Bicep)
        uses: azure/cli@v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --template-file bicep/main.bicep \
              --parameters \
                baseName="$BASE_NAME" \
                location="$AZURE_LOCATION" \
                publicFeeds="$PUBLIC_FEEDS" \
                adminClientId="$ADMIN_CLIENT_ID" \
              --output none
        env:
          PUBLIC_FEEDS: ${{ vars.PUBLIC_FEEDS }}
          ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}

  function:
    needs: infrastructure
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-function.yml
    secrets: inherit
