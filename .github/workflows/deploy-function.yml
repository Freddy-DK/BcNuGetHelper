name: Deploy Function App

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

concurrency: deploy-function

defaults:
  run:
    shell: pwsh

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FUNCTION_APP_NAME: ${{ format('{0}-func', vars.BASE_NAME) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build token-management web app
        working-directory: webapp
        run: |
          npm ci
          npm run build

      - name: Build function app
        run: dotnet publish BcNuGetHelper -c Release -o publish

      - name: Deploy function app
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: publish
          sku: flexconsumption
          remote-build: false

      - name: Deployment summary
        if: success()
        env:
          WEBAPP_USERS: ${{ vars.WEBAPPUSERS }}
        run: |
          $url = "https://$($env:FUNCTION_APP_NAME).azurewebsites.net/api/app/"
          $encoded = [uri]::EscapeDataString($url)
          $qr = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=$encoded"

          $logins = @()
          if ($env:WEBAPP_USERS) {
            $logins = $env:WEBAPP_USERS -split '[,; ]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }
          if ($logins.Count -gt 0) {
            $usersMd = ($logins | ForEach-Object { "- $_" }) -join "`n"
          } else {
            $usersMd = "_No logins configured yet — the web app is disabled until the WEBAPPUSERS variable is set._"
          }

          $summary = @"
          ## Token management web app

          Manage NuGet feed access keys with the app below.

          **Web app URL** (copy):

              $url

          Or open it directly: <a href="$url" target="_blank" rel="noopener noreferrer"><strong>$url</strong></a>

          Scan to open on a phone:

          ![QR code for the web app]($qr)

          ### Who can sign in

          $usersMd

          To change who has access, edit the **WEBAPPUSERS** repository variable (Settings -> Secrets and variables -> Actions) and re-run the **Deploy** workflow.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
