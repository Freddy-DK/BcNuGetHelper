name: Deploy Pages

on:
  workflow_dispatch:
  # Rebuild the site whenever runtime packages have (re)generated. The concurrency below queues
  # these so overlapping generations don't build the site in parallel.
  workflow_run:
    workflows: [ "Generate Runtime NuGet Packages" ]
    types: [ completed ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  BASE_NAME: ${{ vars.BASE_NAME }}
  PUBLIC_FEEDS: ${{ vars.PUBLIC_FEEDS }}
  # When set, its raw JSON overrides site/branding.json.
  BRANDING: ${{ vars.BRANDING }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Only rebuild automatically when the runtime generation succeeded; manual runs always build.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: |
          # Metadata is read anonymously from the public feeds; no credentials needed.
          ./site/Build-Site.ps1 `
            -BaseUrl "https://$($env:BASE_NAME)-func.azurewebsites.net" `
            -PublicFeeds "$($env:PUBLIC_FEEDS)" `
            -OutputDir "_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
