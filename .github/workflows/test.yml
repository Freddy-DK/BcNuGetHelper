name: End 2 End Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: test

env:
  BASE_NAME: ${{ vars.BASE_NAME }}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME || format('{0}-rg', vars.BASE_NAME) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get function key
        id: key
        run: |
          key=$(az functionapp keys list --name "${BASE_NAME}-func" --resource-group "$RESOURCE_GROUP_NAME" --query "functionKeys.default" -o tsv)
          echo "::add-mask::$key"
          echo "function_key=$key" >> "$GITHUB_OUTPUT"

      - name: Run NuGet feed tests
        shell: pwsh
        env:
          FUNCTION_KEY: ${{ steps.key.outputs.function_key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tests/Test-NuGetFeeds.ps1 `
            -BaseUrl "https://$($env:BASE_NAME)-func.azurewebsites.net" `
            -FunctionKey $env:FUNCTION_KEY `
            -GitHubToken $env:GH_TOKEN

      - name: Run BcContainerHelper tests
        shell: pwsh
        env:
          FUNCTION_KEY: ${{ steps.key.outputs.function_key }}
        run: |
          ./tests/Test-BcContainerHelper.ps1 `
            -BaseUrl "https://$($env:BASE_NAME)-func.azurewebsites.net" `
            -FunctionKey $env:FUNCTION_KEY
