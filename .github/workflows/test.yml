name: End 2 End Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: test

defaults:
  run:
    shell: pwsh

env:
  BASE_NAME: ${{ vars.BASE_NAME }}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME || format('{0}-rg', vars.BASE_NAME) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get admin token
        id: token
        run: |
          # Entra bearer token for the admin endpoints (upload, access keys); replaces Functions host keys.
          $token = az account get-access-token --resource https://management.core.windows.net/ --query accessToken -o tsv
          Write-Host "::add-mask::$token"
          "access_token=$token" >> $env:GITHUB_OUTPUT

      - name: Run NuGet feed tests
        env:
          ADMIN_TOKEN: ${{ steps.token.outputs.access_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tests/Test-NuGetFeeds.ps1 `
            -BaseUrl "https://$($env:BASE_NAME)-func.azurewebsites.net" `
            -AccessToken $env:ADMIN_TOKEN `
            -GitHubToken $env:GH_TOKEN

      - name: Run BcContainerHelper tests
        env:
          ADMIN_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          ./tests/Test-BcContainerHelper.ps1 `
            -BaseUrl "https://$($env:BASE_NAME)-func.azurewebsites.net" `
            -AccessToken $env:ADMIN_TOKEN
